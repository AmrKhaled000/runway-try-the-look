<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products — Runway</title>
<style>body{font-family:Helvetica,Arial,sans-serif;margin:0;padding:40px;background:#fff;color:#151413}h1{margin:0 0 24px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px} .card{border:1px solid #c8c8c8;padding:16px} .card img{width:100%;height:240px;object-fit:contain} .name{font-weight:500;margin:8px 0 4px} .price{color:#666} a{color:inherit}</style></head><body>
<h1>All products</h1>
<div id="grid" class="grid"></div>
<script>
fetch('/api/products').then(r=>r.json()).then(items=>{
  const g=document.getElementById('grid');
  items.forEach(p=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${p.image}" alt=""><div class="name">${p.name}</div><div class="price">$${p.price.toFixed(2)}</div><a href="${p.url}" target="_blank">View original ↗</a>`;
    g.appendChild(d);
  });
});
</script></body></html>
