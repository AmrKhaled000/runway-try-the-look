<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Add Model</title>
<style>body{font-family:Helvetica,Arial,sans-serif;margin:0;padding:40px;background:#fff;color:#151413;max-width:720px}label{display:block;margin:12px 0 4px;font-weight:500}input,textarea{width:100%;padding:8px;border:1px solid #c8c8c8;font:inherit}button{margin-top:16px;padding:12px 20px;background:#151413;color:#fff;border:0;cursor:pointer} .row{display:flex;gap:12px} .row>div{flex:1}</style></head><body>
<h1>Add a model (look)</h1>
<form id="f">
  <label>Name</label><input name="name" required>
  <label>Model image URL (640)</label><input name="modelImage" required>
  <label>Original image URL (1080)</label><input name="originalImage" required>
  <label>Description</label><textarea name="description"></textarea>
  <label>Products (comma-separated ids)</label><input name="products">
  <label>Pins (JSON array: [{"product":"...","left":50,"top":28}])</label><textarea name="pins"></textarea>
  <button type="submit">Add model</button>
</form>
<div id="msg"></div>
<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f=e.target;
  const body={
    name:f.name.value,
    modelImage:f.modelImage.value,
    originalImage:f.originalImage.value,
    description:f.description.value,
    products:f.products.value.split(',').map(s=>s.trim()).filter(Boolean),
    pins: JSON.parse(f.pins.value||'[]')
  };
  const r=await fetch('/api/looks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json();
  document.getElementById('msg').textContent = r.ok ? 'Added: '+data.name : (data.error||'Error');
  if(r.ok) f.reset();
});
</script></body></html>
